[project]
name = "ticket-similarity-assistant"
version = "0.1.0"
description = "Retrieves similar past support tickets and their original resolutions for a human support agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

# CPU-only PyTorch wheels on every platform, so the container never pulls CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: needs the real embedding model on disk (skipped when it is absent)",
    "postgres: needs a disposable PostgreSQL database in TEST_DATABASE_URL (skipped when it is unset)",
]
